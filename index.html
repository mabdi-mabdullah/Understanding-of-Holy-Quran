<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexicon — Classical & Quranic Arabic Study Companion</title>
  <meta name="description" content="Alphabetical Quranic Arabic vocabulary dictionary (1,404 Classical & Quranic Arabic Base Words), comprehensive Grammar Rules across Units 1 to 5, and authentic Tajweed modules. Fast, diacritic-tolerant search.">
  <meta name="theme-color" content="#0f766e">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Lexicon — Classical & Quranic Arabic Study Companion">
  <meta property="og:description" content="Bilingual Quranic Arabic study companion: vocabulary dictionary, comprehensive grammar rules, and Tajweed.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Amiri (Arabic), Gulzar (Urdu), Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Gulzar&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-lockup">
          <div class="brand-primary-row">
            <h1 class="brand-title">Lexicon</h1>
            <span class="brand-arabic-badge font-ar" lang="ar" dir="rtl" aria-label="Al-Mu'jam">المُعْجَم</span>
          </div>
          <p class="brand-descriptor">Classical &amp; Quranic Arabic Study Companion</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Language Toggles (Visible for Tajweed, Rules & Translations tabs; Hidden on Words tab which is bilingual) -->
        <div class="lang-switcher" id="langSwitcher" role="group" aria-label="Language selection toggles" style="display: none;">
          <button id="toggleUrduBtn" class="lang-pill" title="Filter to Urdu only"><span class="font-urdu">اردو</span></button>
          <button id="toggleEnglishBtn" class="lang-pill" title="Filter to English only">English</button>
        </div>
      </div>
    </header>

    <!-- Working Draft Status Banner -->
    <aside class="notice-banner" role="status" aria-label="Dataset development status">
      <div class="notice-content">
        <span class="notice-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </span>
        <p class="notice-text">
          <span class="notice-tag">Working Draft</span>
          This lexicon is an in-progress study preview. Active audit and root verification are ongoing across the dataset, so expect occasional inaccuracies, provisional roots, or unrefined entries.
        </p>
      </div>
    </aside>

    <!-- Main Navigation Tabs: 1. Tajweed, 2. Words (Default Active), 3. Rules, 4. Translations -->
    <nav class="main-tabs" role="tablist" aria-label="Main study views">
      <button id="tabTajweedBtn" class="main-tab-btn" role="tab" aria-selected="false" aria-controls="viewTajweed">
        <span class="tab-text">Tajweed</span>
      </button>
      <button id="tabWordsBtn" class="main-tab-btn active" role="tab" aria-selected="true" aria-controls="viewWords">
        <span class="tab-text">Words</span>
      </button>
      <button id="tabRulesBtn" class="main-tab-btn" role="tab" aria-selected="false" aria-controls="viewRules">
        <span class="tab-text">Rules</span>
      </button>
      <button id="tabAyahsBtn" class="main-tab-btn" role="tab" aria-selected="false" aria-controls="viewAyahs">
        <span class="tab-text">Translations</span>
      </button>
    </nav>

    <!-- Tab View 1: Tajweed (First tab in visual order, hidden initially) -->
    <div id="viewTajweed" class="tab-view" role="tabpanel" aria-labelledby="tabTajweedBtn" style="display: none;">
      <!-- Quick Floating Topic Skipper -->
      <div id="tajweedSkipper" class="tajweed-skipper" aria-label="Quick topic navigation">
        <button id="tajweedPrevTopicBtn" class="skipper-btn" title="Previous Topic" type="button">&uarr; Prev</button>
        <span class="skipper-sep" aria-hidden="true">|</span>
        <button id="tajweedNextTopicBtn" class="skipper-btn skipper-btn-primary" title="Next Topic" type="button">&darr; Next Topic</button>
      </div>

      <main id="tajweedList" class="continuous-doc-wrapper" aria-live="polite">
        <!-- Rendered dynamically by app.js as a single continuous long-form document -->
      </main>
    </div>

    <!-- Tab View 2: Words Dictionary & Universal Search (ACTIVE BY DEFAULT) -->
    <div id="viewWords" class="tab-view active" role="tabpanel" aria-labelledby="tabWordsBtn">
      <!-- Sticky Search & Alphabet Controls -->
      <section class="search-controls">
        <!-- Search Input Box prioritizing Arabic & Transliteration -->
        <div class="search-box-wrapper">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </span>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search Quranic vocabulary (e.g. متقون, taqwa, or pious)... [/]"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          >
          <button id="clearSearchBtn" class="clear-btn" aria-label="Clear search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <!-- Horizontal Alphabet Jump Bar -->
        <div class="alphabet-bar-wrapper">
          <nav id="alphabetBar" class="alphabet-bar" aria-label="Alphabetical navigation">
            <!-- Rendered dynamically by app.js -->
          </nav>
        </div>
      </section>

      <!-- Word List Display -->
      <main id="dictionaryList" class="dictionary-list" dir="rtl" aria-live="polite">
        <!-- Cards rendered dynamically by app.js -->
      </main>
    </div>

    <!-- Tab View 3: Grammar Rules Reference (Third tab in visual order, hidden initially) -->
    <div id="viewRules" class="tab-view" role="tabpanel" aria-labelledby="tabRulesBtn" style="display: none;">
      <!-- Sticky Unit & Rule Selector Control Deck -->
      <section class="search-controls">
        <div class="rule-control-deck">
          <!-- Direct 1-Click Unit Switcher Bar -->
          <nav class="rule-unit-bar" id="ruleUnitBar" role="tablist" aria-label="Course Units">
            <button class="rule-unit-pill active" data-unit="1" type="button">Unit 1</button>
            <button class="rule-unit-pill" data-unit="2" type="button">Unit 2</button>
            <button class="rule-unit-pill" data-unit="3" type="button">Unit 3</button>
            <button class="rule-unit-pill" data-unit="4" type="button">Unit 4</button>
            <button class="rule-unit-pill" data-unit="5" type="button">Unit 5</button>
          </nav>

          <div class="rule-selector-row" id="ruleSelectorRow">
            <!-- Custom Apple-Grade Rule Dropdown -->
            <div class="custom-select-wrapper" id="customRuleSelectWrapper">
              <button type="button" class="custom-select-trigger" id="customRuleTrigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Select Rule">
                <span class="custom-trigger-leading">
                  <span class="custom-trigger-badge" id="customRuleTriggerBadge">Overview</span>
                  <span class="custom-trigger-title" id="customRuleTriggerTitle">All Unit 1 Rules (Brief Overview)</span>
                </span>
                <span class="custom-trigger-chevron" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"/>
                  </svg>
                </span>
              </button>

              <!-- Custom Floating Dropdown Menu Popover -->
              <div class="custom-dropdown-menu" id="customRuleMenu" role="listbox" aria-label="Rules List" tabindex="-1">
                <!-- Populated dynamically by app.js -->
              </div>
            </div>

            <!-- Hidden native selects kept for accessibility and programmatic syncing -->
            <select id="ruleUnitSelect" class="filter-select visually-hidden" aria-hidden="true" tabindex="-1">
              <option value="1" selected>Unit 1</option>
              <option value="2">Unit 2</option>
              <option value="3">Unit 3</option>
              <option value="4">Unit 4</option>
              <option value="5">Unit 5</option>
            </select>
            <select id="ruleSelect" class="filter-select visually-hidden" aria-hidden="true" tabindex="-1">
              <!-- Populated dynamically by app.js -->
            </select>
          </div>
        </div>
      </section>

      <main id="rulesList" class="continuous-doc-wrapper" aria-live="polite">
        <!-- Rendered dynamically by app.js -->
      </main>
    </div>

    <!-- Tab View 4: Translations (Fourth tab in visual order, UNDER CONSTRUCTION) -->
    <div id="viewAyahs" class="tab-view" role="tabpanel" aria-labelledby="tabAyahsBtn" style="display: none;">
      <main id="ayahsList" class="ayahs-list" aria-live="polite">
        <!-- Under Construction state rendered dynamically by app.js -->
      </main>
    </div>

  </div>

  <!-- Floating Back to Top Button -->
  <button id="backToTopBtn" class="back-to-top-btn" aria-label="Back to top" title="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <!-- Embedded Data & App Logic -->
  <script src="data/words_data.js"></script>
  <script src="data/rules_data.js"></script>
  <script src="data/tajweed_data.js"></script>
  <script src="data/translations_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
